<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jimmy 的作品</title>
<style>
  :root { --bg: #f6f7fb; --fg: #1b2033; --dim: #5c6480; --card: #ffffff; --line: #dde1ee; --accent: #3557d6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0e1a; --fg: #e8ebf7; --dim: #9aa2bf; --card: #151a2c; --line: #262c45; --accent: #8fa6ff; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; line-height: 1.6; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  a.card { display: flex; gap: 14px; align-items: center; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none; }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
  a.card img { width: 56px; height: 56px; border-radius: 12px; flex: none; }
  a.card b { display: block; font-size: 17px; }
  a.card span { color: var(--dim); font-size: 14px; }
  a.card .key { width: 56px; height: 56px; border-radius: 12px; flex: none; display: grid; place-items: center; background: #ffc93c; color: #1f2150; font: 700 30px/1 system-ui, sans-serif; box-shadow: 0 4px 0 #c9a400; }
</style>
</head>
<body>
<main>
  <h1>Jimmy 的作品</h1>
  <p class="sub">手機、平板、電腦都能開。</p>
  <div class="grid">
    <!-- 新專案：在這裡加一張卡片 -->
    <a class="card" href="wuling-stargazing/">
      <img src="wuling-stargazing/icon-192.png" alt="">
      <div><b>武陵星空</b><span>武陵農場觀星星座盤，指向天空看星座，可離線使用</span></div>
    </a>
    <a class="card" href="wuling-grok/">
      <img src="wuling-grok/icon-180.png" alt="">
      <div><b>武陵觀星（Grok 版）</b><span>另一個版本的武陵觀星：星圖、對星（相機＋羅盤）、今晚推薦</span></div>
    </a>
    <a class="card" href="kevin-typing/v2/">
      <div class="key" aria-hidden="true">K</div>
      <div><b>Kevin 的打字大冒險</b><span>英文打字練習遊戲，11 個主題、單字發音，平板接鍵盤最好玩</span></div>
    </a>
  </div>
</main>
</body>
</html>
